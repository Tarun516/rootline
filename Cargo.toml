[workspace]
members = ["crates/rootline-core", "crates/rootline-engine", "crates/rootline-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
# No backdated MSRV promise: the floor is the pinned toolchain CI proves.
# Lower it only with a CI job that actually builds that version.
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
